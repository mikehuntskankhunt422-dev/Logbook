[package]
name = "logbook"
version = "0.1.0"
description = "Logbook: a private multimedia journal you can print as a book"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "logbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

# The Tauri 2.12 release of 2026-09-26, pinned exactly like the npm side (D79).
[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-opener = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
