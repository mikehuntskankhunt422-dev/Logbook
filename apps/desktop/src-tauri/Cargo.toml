[package]
name = "logbook"
version = "0.1.0"
description = "Logbook: a private multimedia journal you can print as a book"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "logbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

# The Tauri 2.12 release of 2026-09-26, pinned exactly like the npm side (D79).
[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-notification = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File contents from Android's webview, which can only send text (D90).
base64 = "0.22"
time = "0.3"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.0"
# Opening Logbook when the person signs in to the computer, if they choose (D110).
tauri-plugin-autostart = "=2.7.0"
# Phones update from the store or a new APK (D90).
tauri-plugin-updater = "=2.13.1"
# Another computer's changes to the journal folder (D102).
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# The person's own picture as the app's icon (D101): an .ico for Windows, and PNGs read for Linux
# windows. The versions Tauri's build already locks.
ico = "=0.5.0"

# The same windows crate as Tauri's, with the shell's shortcut and icon calls (app_icon/win.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# AppKit for the Dock icon and Logbook's icon in Applications (app_icon/mac.rs), as Tauri uses it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSWorkspace"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
