name: Desktop installers

# Logbook's installers on Windows, macOS and Linux (M5 slice E, D84). A push to a work branch that
# touches the app builds them as workflow artifacts to try; a v* tag also publishes them as a
# GitHub release. So does running it by hand on main ("Run workflow", D87), which creates the tag.
# Unsigned (D77); macOS builds are signed ad hoc. docs/DEVELOPING.md has the steps.
#
# Automatic updates (D88): with the TAURI_SIGNING_PRIVATE_KEY secrets set, each build also signs the
# files the updater installs, and a release carries latest.json, which the app reads from the
# newest release. Publishing refuses to go ahead without them.

on:
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as in apps/desktop/package.json (e.g. 0.1.0). Run it on main.
        required: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            args: ''
            rust-targets: ''
          - name: macOS
            os: macos-latest
            # The app bundle too: the updater installs it, zipped (Logbook.app.tar.gz).
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            # An older Ubuntu, so the AppImage runs on more distributions.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The version asked for matches the app's version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          WANTED: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$WANTED" != "v$version" ]; then
            echo "::error::$WANTED doesn't match the app's version $version (apps/desktop/package.json)."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Publish from main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Updater signing key
        id: signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$HAS_KEY" = true ]; then
            echo "config=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISHING" = true ]; then
            echo "::error::A release needs the updater signing key: add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets (docs/DEVELOPING.md)."
            exit 1
          else
            echo "::notice::No updater signing key, so these installers can't be offered as updates. Fine for trying a branch."
          fi
      - name: Build the installers
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }} ${{ steps.signing.outputs.config }}
        working-directory: apps/desktop
        env:
          # The API's address, once it's deployed (M6). Without it the app can't order books and says so.
          VITE_API_URL: ${{ vars.LOGBOOK_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p installers
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} installers/ \;
          ls -l installers
          test -n "$(ls installers)"
      - name: The update files are signed with the app's key
        if: steps.signing.outputs.config != ''
        shell: bash
        run: node --experimental-transform-types --no-warnings apps/desktop/scripts/latest-json.ts --verify installers
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: installers/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The updater's latest.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: node --experimental-transform-types --no-warnings apps/desktop/scripts/latest-json.ts installers "$TAG" "$GITHUB_REPOSITORY"
      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version="${TAG#v}"
          # 0.x versions are previews, said in the title. Not GitHub pre-releases: the updater reads
          # latest.json from the release GitHub calls latest, which is never a pre-release (D88).
          case "$version" in 0.*) title="Logbook $version (preview)" ;; *) title="Logbook $version" ;; esac
          # Run by hand, the tag is made here, on the commit that was built.
          gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "$title" --notes-file apps/desktop/RELEASE-NOTES.md
