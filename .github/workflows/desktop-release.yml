name: Desktop installers

# Logbook's installers on Windows, macOS and Linux (M5 slice E, D84), and its Android app (D90). A
# push to a work branch that touches the app builds them as workflow artifacts to try; a v* tag
# also publishes them as a GitHub release. So does running it by hand on main ("Run workflow",
# D87), which creates the tag. Unsigned (D77); macOS builds are signed ad hoc. docs/DEVELOPING.md
# has the steps.
#
# Android (D90): a branch build is "Logbook Preview", a separate app signed with a throwaway key,
# tried in an emulator. A release's APK is signed in the `sign` job with ANDROID_KEYSTORE_BASE64,
# the key every Logbook APK must carry for Android to install it over the last one.
#
# Automatic updates (D88): every build makes the files the updater installs, signed with a
# throwaway key, and never mentions the real one. Only a release runs the `sign` job, on a fresh
# machine where no dependency or build script has run, which re-signs them with
# TAURI_SIGNING_PRIVATE_KEY (a secret of the repository or of its `release` environment). The
# release carries latest.json, which the app reads from the newest release.

on:
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as in apps/desktop/package.json (e.g. 0.1.0). Run it on main.
        required: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            args: ''
            rust-targets: ''
          - name: macOS
            os: macos-latest
            # The app bundle too: the updater installs it, zipped (Logbook.app.tar.gz).
            bundles: app,dmg
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            # An older Ubuntu, so the AppImage runs on more distributions.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The version asked for matches the app's version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          WANTED: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$WANTED" != "v$version" ]; then
            echo "::error::$WANTED doesn't match the app's version $version (apps/desktop/package.json)."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Publish from main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: A throwaway key for the build's update signatures
        shell: bash
        working-directory: apps/desktop
        run: |
          npx tauri signer generate -w throwaway.key -p throwaway --ci -f > /dev/null
          echo "THROWAWAY_SIGNING_KEY=$(cat throwaway.key)" >> "$GITHUB_ENV"
          # Its public half, for checking the branch build's signatures below.
          node -e "const fs = require('fs'); fs.writeFileSync(process.env.RUNNER_TEMP + '/throwaway.conf.json', JSON.stringify({ plugins: { updater: { pubkey: fs.readFileSync('throwaway.key.pub', 'utf8').trim() } } }))"
          rm throwaway.key throwaway.key.pub
      - name: Build the installers
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
        working-directory: apps/desktop
        env:
          # The API's address, once it's deployed (M6). Without it the app can't order books and says so.
          VITE_API_URL: ${{ vars.LOGBOOK_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.THROWAWAY_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: throwaway
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p installers
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} installers/ \;
          ls -l installers
          test -n "$(ls installers)"
      # Branch builds try the signing script and the check with the throwaway key, then drop those
      # signatures. A release keeps them until the `sign` job replaces them.
      - name: Try the signing script with the throwaway key
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          TAURI_SIGNING_PRIVATE_KEY="$THROWAWAY_SIGNING_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=throwaway \
            bash apps/desktop/scripts/sign-updates.sh installers "$version"
          node --experimental-transform-types --no-warnings apps/desktop/scripts/latest-json.ts --verify installers "$RUNNER_TEMP/throwaway.conf.json" "$version"
          rm -f installers/*.sig
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: installers/*
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A branch build is the preview app (src-tauri/gen/android/app/build.gradle.kts).
      VITE_ANDROID_PREVIEW: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The version asked for matches the app's version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          WANTED: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$WANTED" != "v$version" ]; then
            echo "::error::$WANTED doesn't match the app's version $version (apps/desktop/package.json)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: Android
      - run: npm ci
      # Phones with 64-bit and 32-bit ARM chips, and x86-64 for emulators and Chromebooks.
      - name: Build the APK
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.LOGBOOK_API_URL }}
        run: |
          # The NDK that comes with the runner (its newest, else the newest under the SDK).
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "NDK: $NDK_HOME"
          export NDK_HOME
          npx tauri android build --apk --target aarch64 armv7 x86_64 --ci
      - name: Collect the APK
        run: |
          mkdir -p android
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -l {} \;
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          test -n "$apk"
          cp "$apk" android/Logbook-unsigned.apk
      - name: Sign the preview with a throwaway key
        if: env.VITE_ANDROID_PREVIEW == '1'
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 -storepass throwaway \
            -alias logbook -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Logbook Preview" 2> /dev/null
          ANDROID_KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/throwaway.p12") ANDROID_KEYSTORE_PASSWORD=throwaway \
            bash apps/desktop/scripts/sign-android.sh android/Logbook-unsigned.apk "android/Logbook-Preview-$version.apk"
          rm "$RUNNER_TEMP/throwaway.p12" android/Logbook-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VITE_ANDROID_PREVIEW == '1' && 'android-preview' || 'android-unsigned' }}
          path: android/*.apk
          retention-days: 14
          if-no-files-found: error

  # The preview APK in an Android emulator (apps/desktop/e2e/android.ts): branch builds only.
  android-test:
    name: Android app in an emulator
    if: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: android-preview
          path: android
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/*.apk
            node --experimental-transform-types --no-warnings apps/desktop/e2e/android.ts android-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: android-e2e
          retention-days: 14
          if-no-files-found: ignore

  # The only job that's given the real updater key and the Android key: a release only (decided
  # before a machine is assigned), a fresh machine, nothing installed from npm or crates, no npm
  # cache.
  sign:
    name: Sign the update files and the Android app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, android]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sign with the release key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: bash apps/desktop/scripts/sign-updates.sh installers "${TAG#v}"
      - name: Every update file is signed with the key the app expects, for this version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: node --experimental-transform-types --no-warnings apps/desktop/scripts/latest-json.ts --verify installers apps/desktop/src-tauri/tauri.conf.json "${TAG#v}"
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: android
      - name: Sign the Android app with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: bash apps/desktop/scripts/sign-android.sh android/Logbook-unsigned.apk "installers/Logbook-${TAG#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installers
          path: installers/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-installers
          path: installers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The updater's latest.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: node --experimental-transform-types --no-warnings apps/desktop/scripts/latest-json.ts installers "$TAG" "$GITHUB_REPOSITORY"
      - name: Checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version="${TAG#v}"
          # 0.x versions are previews, said in the title. Not GitHub pre-releases: the updater reads
          # latest.json from the release GitHub calls latest, which is never a pre-release (D88).
          case "$version" in 0.*) title="Logbook $version (preview)" ;; *) title="Logbook $version" ;; esac
          # Run by hand, the tag is made here, on the commit that was built.
          gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "$title" --notes-file apps/desktop/RELEASE-NOTES.md
