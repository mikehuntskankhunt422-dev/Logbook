name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    name: Build, end-to-end, accessibility, Lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Lighthouse CI (uses the runner's preinstalled Google Chrome)
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  desktop:
    name: Desktop app (Rust tests, smoke test in the real window)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Tauri's Linux libraries, plus WebKit's WebDriver, a virtual display and python3-xlib (to close
      # the window as a close button does) for the smoke test (M5 §1.2).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb python3-xlib
      - run: npm ci
      - run: npm run build:desktop -w @logbook/web
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo install tauri-driver --version =2.0.6 --locked
      - run: npx tauri build --debug --no-bundle
        working-directory: apps/desktop
      - run: xvfb-run -a npm run test:e2e
        working-directory: apps/desktop
