name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_samples:
        description: Publish the sample PDFs as a GitHub pre-release so Lulu's sandbox can fetch and validate them
        type: boolean
        default: false
      browsers_full:
        description: Preview the 200-page samples in Firefox and WebKit too (about 20 extra minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    name: Build, end-to-end, accessibility, Lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Lighthouse CI (uses the runner's preinstalled Google Chrome)
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  preview-browsers:
    name: Book preview in Firefox and WebKit (page counts, M2 §5)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
        working-directory: apps/web
      # One worker: these previews are slow, and the timings are part of the report. Firefox takes
      # minutes per 200-page book, so those run only when asked for (M2.md §5).
      - run: npx playwright test --project=desktop-firefox --project=desktop-webkit --workers=1 ${{ inputs.browsers_full && ' ' || '--grep "40-page"' }}
        working-directory: apps/web
        env:
          CI: 'true'
          LOGBOOK_ALL_BROWSERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-browsers
          path: apps/web/playwright-report
          retention-days: 7

  print:
    name: Print PDFs (sample books, golden checks)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/server
      - run: npm run test:print
      - run: npm run samples:pack -w @logbook/server
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-books
          path: samples/release
          retention-days: 14

  publish-samples:
    name: Publish sample books for Lulu validation
    if: github.event_name == 'workflow_dispatch' && inputs.publish_samples
    needs: print
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sample-books
          path: sample-books
      # Synthetic sample journals only; never customer content. Validate with
      # `npm run lulu:validate -- <the URL in the job summary>`.
      - name: Create a pre-release with the sample PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lulu-samples-${{ github.run_number }}"
          gh release create "$tag" sample-books/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Sample books for Lulu validation (run ${{ github.run_number }})" \
            --notes "Synthetic sample journals rendered by CI at $GITHUB_SHA, for Lulu's sandbox validators to download. Not a Logbook release."
          echo "Lulu base URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" >> "$GITHUB_STEP_SUMMARY"
